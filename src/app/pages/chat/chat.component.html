<div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8 h-[calc(100vh-8rem)]">
  <div class="flex flex-col h-full max-w-6xl mx-auto">
    <!-- Header -->
    <div class="bg-gray-900/50 border border-gray-800 rounded-t-2xl p-6 shadow-neo">
      <div class="flex items-center space-x-4">
        <div class="w-12 h-12 bg-gradient-to-br from-neo-blue to-blue-600 rounded-full flex items-center justify-center text-2xl">
          👨‍🏫
        </div>
        <div>
          <h2 class="text-2xl font-bold">AI Mentor Chat</h2>
          <p class="text-sm text-gray-400">Your personal coding assistant</p>
        </div>
        <div class="ml-auto flex items-center space-x-2">
          <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
          <span class="text-sm text-gray-400">Online</span>
        </div>
      </div>
    </div>

    <!-- Messages Container -->
    <div id="message-container" 
         class="flex-grow bg-gray-900/30 border-x border-gray-800 p-6 overflow-y-auto space-y-4"
         style="max-height: calc(100vh - 20rem);">
      <div *ngFor="let message of messages" 
           [ngClass]="{
             'flex justify-end': message.sender === 'user',
             'flex justify-start': message.sender === 'mentor'
           }">
        <div [ngClass]="{
               'bg-neo-blue text-white': message.sender === 'user',
               'bg-gray-800 text-gray-200': message.sender === 'mentor'
             }"
             class="max-w-md px-6 py-4 rounded-2xl shadow-neo">
          <p class="text-sm leading-relaxed">{{ message.text }}</p>
          <p class="text-xs mt-2 opacity-70">
            {{ message.timestamp | date:'short' }}
          </p>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="bg-gray-900/50 border border-gray-800 rounded-b-2xl p-6 shadow-neo">
      <div class="flex items-end space-x-4">
        <div class="flex-grow">
          <textarea
            [(ngModel)]="currentMessage"
            (keypress)="onKeyPress($event)"
            placeholder="Type your message here... (Press Enter to send)"
            rows="3"
            class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-neo-blue focus:border-transparent resize-none"
          ></textarea>
        </div>
        <button
          (click)="sendMessage()"
          [disabled]="!currentMessage.trim()"
          class="px-8 py-3 h-fit bg-neo-blue hover:bg-blue-500 disabled:bg-gray-700 disabled:cursor-not-allowed text-white font-semibold rounded-xl shadow-neo hover:shadow-neo-hover transition-all duration-300 transform hover:scale-105 disabled:transform-none disabled:shadow-none"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
        </button>
      </div>
      <p class="text-xs text-gray-500 mt-3">
        💡 This is a mock chat interface. It will be connected to a real-time backend (WebSocket/Socket.IO) in production.
      </p>
    </div>
  </div>
</div>
